# ============================================
# ShamrockLeads — Docker Compose
# Runs: Scraper Engine + Dashboard
# Node-RED: only on VPS (use --profile ops)
# ============================================
#
# Network: all services share `shamrock-net` so that Docker DNS
# resolves container hostnames (e.g. `shamrock-dashboard`, `traccar`)
# across services.  Traccar forwards webhooks to:
#   http://shamrock-dashboard:5050/api/traccar/webhook
# This explicit network guarantees that hostname is reachable.

networks:
  shamrock-net:
    driver: bridge

services:
  # ── Obscura Stealth Browser Engine (CDP Server) ──
  # Rust-based headless browser — 30MB RAM per page, built-in anti-detect
  # Drop-in replacement for headless Chrome via CDP (Playwright/Puppeteer)
  # Used by: Charlotte, Manatee, Sarasota (Cloudflare-protected counties)
  #
  # Proxy: To route through residential IPs for CF-protected sites, change command to:
  #   command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--stealth", "--proxy", "socks5://user:pass@host:port"]
  obscura:
    image: h4ckf0r0day/obscura:latest
    container_name: shamrock-obscura
    hostname: obscura
    restart: unless-stopped
    # Routes through iMac office residential IP via Tailscale SOCKS proxy (port 1080)
    # Primary: Tailscale mesh → shamrocksimac:1080 (via host tailscaled or ts-proxy sidecar)
    # Legacy:  SSH -R reverse tunnel (iMac LaunchAgent → VPS:1080)
    # 172.18.0.1 = Docker bridge gateway (host IP from container perspective)
    # With Tailscale overlay: use socks5://shamrock-ts-proxy:1080 (container-to-container)
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--stealth", "--proxy", "socks5://172.18.0.1:1080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shamrock-net
    expose:
      - "9222"                            # CDP WebSocket (internal only, no external port)
    # Note: distroless image has no shell/wget/curl — healthcheck via shamrock-leads container
    healthcheck:
      disable: true
    mem_limit: 512m                       # ~30MB per page × 10 concurrent + overhead
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Core: Scraper + Scoring Engine ──
  shamrock-leads:
    build: .
    container_name: shamrock-leads
    restart: unless-stopped
    dns:
      - 8.8.8.8                         # Force Google DNS (bypasses VPS resolver)
      - 1.1.1.1                         # Cloudflare DNS fallback
    env_file:
      - .env
    depends_on:
      - obscura                          # CDP browser must start before scrapers
    volumes:
      - ./creds:/app/creds:ro           # GCP service account key
      - ./logs:/app/logs                # Persistent logs
    networks:
      - shamrock-net
    # ── Security Hardening ──
    security_opt:
      - no-new-privileges:true          # Prevent privilege escalation
    tmpfs:
      - /tmp:size=1g                    # Writable temp (browser profiles, xvfb)
    mem_limit: 4g                       # Cap memory (scrapers + Chromium)
    cpus: 2.0                           # Cap CPU
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── OSINT Worker (Maigret + Blackbird CLIs) ──
  # Writable FS, internal network only. Dashboard calls http://osint-worker:5065
  osint-worker:
    build:
      context: .
      dockerfile: osint-worker/Dockerfile
    container_name: shamrock-osint-worker
    hostname: osint-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OSINT_WORKER_KEY=${OSINT_WORKER_KEY:-}
      - OSINT_MAIGRET_TIMEOUT=${OSINT_MAIGRET_TIMEOUT:-180}
      - OSINT_SHERLOCK_TIMEOUT=${OSINT_SHERLOCK_TIMEOUT:-120}
      - OSINT_BLACKBIRD_TIMEOUT=${OSINT_BLACKBIRD_TIMEOUT:-150}
      - OSINT_SPIDERFOOT_TIMEOUT=${OSINT_SPIDERFOOT_TIMEOUT:-300}
      - OSINT_IGNORANT_TIMEOUT=${OSINT_IGNORANT_TIMEOUT:-45}
      - OSINT_TOUTATIS_TIMEOUT=${OSINT_TOUTATIS_TIMEOUT:-60}
      - OSINT_QUICK_TOP_SITES=${OSINT_QUICK_TOP_SITES:-250}
      - OSINT_DEEP_TOP_SITES=${OSINT_DEEP_TOP_SITES:-800}
      # Instagram session cookie for Toutatis (never log; rotate if leaked)
      - INSTAGRAM_SESSION_ID=${INSTAGRAM_SESSION_ID:-}
      - TOUTATIS_SESSION_ID=${TOUTATIS_SESSION_ID:-}
    expose:
      - "5065"                            # Internal only — no host port
    networks:
      - shamrock-net
    security_opt:
      - no-new-privileges:true
    # Writable root for CLI tools (not public-facing)
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5065/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── ALPR Worker (FL511 traffic cameras + Fast-ALPR) ──
  # Optional profile: docker compose --profile alpr up -d alpr-worker
  # Samples public DOT cameras, matches lpr_watchlist, Slack on hits.
  alpr-worker:
    profiles: ["alpr"]
    build:
      context: .
      dockerfile: alpr-worker/Dockerfile
    container_name: shamrock-alpr-worker
    hostname: alpr-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - ALPR_ENABLED=${ALPR_ENABLED:-true}
      - ALPR_FRAME_INTERVAL_S=${ALPR_FRAME_INTERVAL_S:-2.5}
      - ALPR_MIN_CONFIDENCE=${ALPR_MIN_CONFIDENCE:-0.55}
      - ALPR_STORE_ALL_HITS=${ALPR_STORE_ALL_HITS:-false}
      - ALPR_CROPS_DIR=/data/alpr_crops
      - ALPR_CAMERAS_FILE=/app/config/alpr_cameras.json
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-ShamrockBailDB}
      - SLACK_WEBHOOK_LEADS=${SLACK_WEBHOOK_LEADS:-}
      - SLACK_WEBHOOK_ALPR=${SLACK_WEBHOOK_ALPR:-}
    volumes:
      - alpr-crops:/data/alpr_crops
      - ./config/alpr_cameras.json:/app/config/alpr_cameras.json:ro
    networks:
      - shamrock-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Intelligence Dashboard (FastAPI + Uvicorn) ──
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: shamrock-dashboard
    hostname: shamrock-dashboard
    restart: unless-stopped
    dns:
      - 8.8.8.8                         # Force Google DNS — resolves Wix CNAME for bb.shamrockbailbonds.biz
      - 1.1.1.1                         # Cloudflare DNS fallback
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 5050 --access-log --log-level info
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OSINT_WORKER_URL=http://osint-worker:5065
      - OSINT_WORKER_KEY=${OSINT_WORKER_KEY:-}
      - OSINT_WORKER_TIMEOUT=${OSINT_WORKER_TIMEOUT:-300}
      # Traccar URLs (in-stack GPS). Credentials come from .env via env_file —
      # do NOT blank TRACCAR_PASSWORD here or the client defaults get wiped.
      - TRACCAR_URL=${TRACCAR_URL:-http://traccar:8082}
      - TRACCAR_OSMAND_URL=${TRACCAR_OSMAND_URL:-http://traccar:5055}
      - TRACCAR_PUBLIC_HOST=${TRACCAR_PUBLIC_HOST:-leads.shamrockbailbonds.biz}
    ports:
      - "8088:5050"                     # Dashboard UI (external 8088)
    depends_on:
      - shamrock-leads
      - osint-worker
      - traccar                         # In-stack GPS (portal check-ins + continuous client)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - dashboard-uploads:/app/dashboard/uploads  # Persistent KYC uploads
      - ./config:/app/config:ro                   # Firebase admin SDK + secrets
      - ./creds:/app/creds:ro                     # GCP service account key (Calendar API)
    networks:
      - shamrock-net
    # ── Security Hardening ──
    security_opt:
      - no-new-privileges:true          # Prevent privilege escalation
    read_only: true                     # Root filesystem read-only
    tmpfs:
      - /tmp:size=256m,mode=1777        # Uvicorn temp only (OSINT CLIs live on worker)
    mem_limit: 2g                       # Cap memory (dashboard API)
    cpus: 1.5                           # Cap CPU
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Traccar GPS Intelligence Engine ──
  # Real-time GPS tracking server (Java) — 200+ device protocols
  # REST API on 8082 (internal), webhooks to dashboard:5050
  traccar:
    image: traccar/traccar:latest
    container_name: shamrock-traccar
    restart: unless-stopped
    hostname: traccar
    volumes:
      - traccar-data:/opt/traccar/data        # H2 database (persistent)
      - traccar-logs:/opt/traccar/logs         # Server logs
      - ./config/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro  # Custom config
    ports:
      - "8082:8082"                            # Traccar REST API + Web UI
      - "5055:5055"                            # OsmAnd protocol (phone app tracking)
      - "5055:5055/udp"                        # OsmAnd UDP
      - "5001:5001"                            # GPS103/TK103 (vehicle trackers)
      - "5013:5013"                            # H02 (personal/ankle trackers)
      - "5023:5023"                            # GT06 (OBD2 vehicle)
      - "5027:5027"                            # Teltonika (professional fleet)
    networks:
      - shamrock-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/server"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ops Dashboard: Node-RED ──
  # Only starts with: docker compose --profile ops up -d
  # On VPS (Hetzner), managed by the shamrock-node-red repo separately.
  # Included here for convenience if you want everything in one stack.
  node-red:
    image: nodered/node-red:latest
    container_name: shamrock-node-red
    restart: unless-stopped
    profiles:
      - ops                             # Won't start by default
    environment:
      - TZ=America/New_York
    volumes:
      - node-red-data:/data             # Persistent flows + config
    ports:
      - "1880:1880"                     # Node-RED dashboard
    networks:
      - shamrock-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Social Engine: Content Repurposer + Publisher ──
  # Starts with: docker compose --profile social up -d
  # Or include in full stack: docker compose --profile social --profile ops up -d
  social:
    build:
      context: .
      dockerfile: social/Dockerfile
    container_name: shamrock-social
    hostname: shamrock-social
    restart: unless-stopped
    profiles:
      - social                            # Won't start by default
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: uvicorn social.main:app --host 0.0.0.0 --port 5060 --access-log --log-level info --workers 1
    env_file:
      - .env
    environment:
      - SOCIAL_GROK_ENABLED=true
      - SOCIAL_HUMANIZER_ENABLED=true
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./creds:/app/creds:ro             # GCP service account (Gmail scanner)
    ports:
      - "8089:5060"                       # Social Engine API (external 8089)
    depends_on:
      - dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - shamrock-net
    # ── Security Hardening ──
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Postiz: Open-Source Social Media Manager ──
  # Image: ghcr.io/gitroomhq/postiz-app (https://github.com/gitroomhq/postiz-app)
  # Starts with: docker compose --profile social up -d
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: shamrock-postiz
    hostname: postiz
    restart: always                       # Must retry — Temporal takes ~60s to start
    profiles:
      - social                            # Won't start by default
    environment:
      # ── Core URLs (behind Nginx reverse proxy) ──
      MAIN_URL: "${POSTIZ_MAIN_URL:-https://social.shamrockbailbonds.biz}"
      FRONTEND_URL: "${POSTIZ_MAIN_URL:-https://social.shamrockbailbonds.biz}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_MAIN_URL:-https://social.shamrockbailbonds.biz}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      # ── Auth ── REQUIRED: set POSTIZ_JWT_SECRET in .env (never use default in prod)
      JWT_SECRET: "${POSTIZ_JWT_SECRET:-shamrock-postiz-jwt-secret-change-me}"
      # ── Database ── REQUIRED: set POSTIZ_DB_PASSWORD in .env
      DATABASE_URL: "postgresql://postiz:${POSTIZ_DB_PASSWORD:-shamrock_postiz_2026}@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      # ── Temporal (required v2.12+) ──
      TEMPORAL_ADDRESS: "temporal:7233"
      # ── Self-hosting config ──
      IS_GENERAL: "true"
      NOT_SECURED: "true"
      # SECURITY: Disable public self-registration — this is a private internal tool
      DISABLE_REGISTRATION: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # ── Optional: AI content gen (uses our OpenAI key) ──
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ── Social Provider OAuth Keys ──
      GOOGLE_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      YOUTUBE_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_GMB_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_GMB_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      LINKEDIN_CLIENT_ID: "${LINKEDIN_OAUTH_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_OAUTH_CLIENT_SECRET:-}"
      X_API_KEY: "${TWITTER_OAUTH_CLIENT_ID:-}"
      X_API_SECRET: "${TWITTER_OAUTH_CLIENT_SECRET:-}"
      FACEBOOK_APP_ID: "${META_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${META_APP_SECRET:-}"
      INSTAGRAM_APP_ID: "${META_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${META_APP_SECRET:-}"
      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"
    ports:
      - "5200:5000"                       # Postiz UI + API (external 5200)
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - shamrock-net
    # Image has node but not wget — old healthcheck marked "unhealthy" forever
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s                  # Nest + Temporal workers need time
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── frp server (replace Cloudflare Tunnel / ngrok for BlueBubbles) ──
  # iMac runs frpc outbound → this frps; BlueBubbles stays on localhost:1234.
  # Profile: docker compose --profile tunnel up -d
  # Docs: docs/FRP_TUNNEL.md · https://github.com/fatedier/frp
  frps:
    image: snowdreamtech/frps:0.61.1
    container_name: shamrock-frps
    hostname: frps
    restart: unless-stopped
    profiles:
      - tunnel
    volumes:
      - ./deployment/frp/frps.toml:/etc/frp/frps.toml:ro
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "7001:7001"                       # frpc control plane (7000 = APE Warren)
      - "7500:7500"                       # frps dashboard (restrict via firewall)
      - "12434:12434"                     # BlueBubbles TCP (or bind 127.0.0.1 only)
      - "12222:12222"                     # Office iMac SSH via frpc
    networks:
      - shamrock-net
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Temporal Workflow Engine (required by Postiz v2.12+) ──
  # Handles background scheduling, retries, and workflow orchestration
  # Config mirrors official: github.com/gitroomhq/postiz-docker-compose
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: shamrock-temporal
    restart: unless-stopped
    profiles:
      - social
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    depends_on:
      - temporal-postgres
      - temporal-elasticsearch
    volumes:
      - ./config/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - shamrock-net
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Elasticsearch for Temporal (visibility store) ──
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: shamrock-temporal-elasticsearch
    restart: unless-stopped
    profiles:
      - social
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    expose:
      - 9200
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - shamrock-net
    mem_limit: 1g
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── PostgreSQL for Temporal ──
  temporal-postgres:
    image: postgres:16
    container_name: shamrock-temporal-postgres
    restart: unless-stopped
    profiles:
      - social
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    expose:
      - 5432
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - shamrock-net
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── PostgreSQL for Postiz ──
  postiz-postgres:
    image: postgres:17-alpine
    container_name: shamrock-postiz-postgres
    restart: unless-stopped
    profiles:
      - social
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD:-shamrock_postiz_2026}"
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - shamrock-net
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Redis for Postiz (queue/cache) ──
  postiz-redis:
    image: redis:7-alpine
    container_name: shamrock-postiz-redis
    restart: unless-stopped
    profiles:
      - social
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - shamrock-net
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── DocuSeal: open-source e-sign (replaces SignNow for new packets) ──
  # Upstream: https://github.com/docusealco/docuseal
  # Start: docker compose --profile paperwork up -d
  # Public: https://sign.shamrockbailbonds.biz → host :5300
  # See docs/PAPERWORK_PORTAL_DOCUSEAL.md
  docuseal:
    image: docuseal/docuseal:latest
    container_name: shamrock-docuseal
    hostname: docuseal
    restart: unless-stopped
    profiles:
      - paperwork
    environment:
      DATABASE_URL: "postgresql://docuseal:${DOCUSEAL_DB_PASSWORD:-shamrock_docuseal_2026}@docuseal-postgres:5432/docuseal"
      # Public hostname for sign links (behind nginx TLS)
      HOST: "${DOCUSEAL_HOST:-sign.shamrockbailbonds.biz}"
      FORCE_SSL: "true"
      # Optional branding: configure in DocuSeal admin after first login
    ports:
      - "5300:3000"
    volumes:
      - docuseal-data:/data/docuseal
    depends_on:
      docuseal-postgres:
        condition: service_healthy
    networks:
      - shamrock-net
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docuseal-postgres:
    image: postgres:16-alpine
    container_name: shamrock-docuseal-postgres
    restart: unless-stopped
    profiles:
      - paperwork
    environment:
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: "${DOCUSEAL_DB_PASSWORD:-shamrock_docuseal_2026}"
      POSTGRES_DB: docuseal
    volumes:
      # Named volume — back up daily (Postiz lesson: never lose signing DB)
      - docuseal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shamrock-net
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  node-red-data:
    driver: local
  dashboard-uploads:
    driver: local
  alpr-crops:
    driver: local
  traccar-data:
    driver: local
  traccar-logs:
    driver: local
  postiz-config:
    driver: local
  postiz-uploads:
    driver: local
  postiz-postgres-data:
    driver: local
  temporal-postgres-data:
    driver: local
  temporal-elasticsearch-data:
    driver: local
  docuseal-data:
    driver: local
  docuseal-postgres-data:
    driver: local
