name: Assemble intake file

on:
  push:
    branches: [cursor/accept-intake-source-tags-24c1]
    paths:
      - .github/workflows/assemble-intake-file.yml

permissions:
  contents: write

jobs:
  assemble:
    name: Restore intake fan-out comment bars
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cursor/accept-intake-source-tags-24c1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the two comment bars
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import pathlib, re, subprocess, sys
          path = pathlib.Path("dashboard/services/intake_fanout.py")
          text = path.read_text()

          def fix(text, prefix, count):
              pattern = re.compile("^" + re.escape(prefix) + "─+$", re.M)
              repl = prefix + ("─" * count)
              new, n = pattern.subn(repl, text)
              if n != 1:
                  sys.exit(f"{prefix!r} matches {n}")
              return new

          text = fix(text, "# ── Senders (return (ok, error, unconfigured)) ", 32)
          text = fix(text, "# ── Outbox ", 68)
          path.write_text(text)
          sha = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          if sha != "1fdef9f0e434581537d79e04666043d4bebcbeb9":
              sys.exit("unexpected fan-out blob " + sha)
          print("fan-out blob", sha)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/services/intake_fanout.py
          git rm -f .github/workflows/assemble-intake-file.yml
          git commit -m "Keep the intake fan-out labels without the comment padding change."
          git push origin HEAD:cursor/accept-intake-source-tags-24c1
