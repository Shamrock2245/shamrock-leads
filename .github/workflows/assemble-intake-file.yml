name: Assemble intake file

on:
  push:
    branches: [cursor/accept-intake-source-tags-24c1]
    paths:
      - .github/workflows/assemble-intake-file.yml

permissions:
  contents: write

jobs:
  assemble:
    name: Merge main and keep the intake changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cursor/accept-intake-source-tags-24c1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main and keep the intake note
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge origin/main -m "Merge main into the intake source-tag branch."
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            unexpected=$(git diff --name-only --diff-filter=U | grep -v '^CHANGELOG.md$' || true)
            if [ -n "$unexpected" ]; then
              echo "unexpected merge conflicts:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --ours -- CHANGELOG.md
            git add CHANGELOG.md
          fi
          if grep -n '<<<<<<<' CHANGELOG.md; then
            echo "changelog still has conflict markers"
            exit 1
          fi
          git rm -f .github/workflows/assemble-intake-file.yml
          if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
            git commit -m "Merge main into the intake source-tag branch."
          fi
          stat=$(git diff --numstat origin/main HEAD -- CHANGELOG.md)
          test "$stat" = "$(printf '5\t0\tCHANGELOG.md')"
          git diff --numstat origin/main HEAD
          git push origin HEAD:cursor/accept-intake-source-tags-24c1
