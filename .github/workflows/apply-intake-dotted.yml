name: apply-intake-dotted
on:
  push:
    branches: [cursor/intake-upsert-preserve-24c1]
    paths: ['.github/workflows/apply-intake-dotted.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/intake-upsert-preserve-24c1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      - name: Merge main and keep non-empty intake fields
        run: |
          set -euo pipefail
          if [ "$(git hash-object dashboard/routers/intake.py)" = "6447654ff5036247b2823b79eda6f511d8cd5b13" ] && [ ! -f .github/workflows/apply-intake-dotted.yml ]; then
            echo "already applied"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git merge origin/main --no-edit || true
          python3 - << 'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text()
          marker = "<<<<<<< HEAD\n"
          if marker not in text:
              raise SystemExit("expected a changelog conflict")
          start = text.index(marker)
          mid = text.index("\n=======\n", start)
          end_line = text.index("\n>>>>>>> ", mid)
          end = text.index("\n", end_line + 1)
          ours = text[start + len(marker):mid]
          theirs = text[mid + len("\n=======\n"):end_line]
          after = text[end + 1:]
          if not ours.endswith("\n"):
              ours += "\n"
          if not theirs.endswith("\n"):
              theirs += "\n"
          resolved = text[:start] + ours + "\n" + theirs + after
          if "<<<<<<<" in resolved or ">>>>>>>" in resolved:
              raise SystemExit("conflict markers remain")
          p.write_text(resolved)
          PY
          test "$(git hash-object CHANGELOG.md)" = "37cff5b134c5edcca99a575a03a94eaeffd4c08d"
          git add CHANGELOG.md
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit --no-edit
          curl -fsSL -o /tmp/fix.patch "https://raw.githubusercontent.com/Shamrock2245/shamrock-telegram-app/a2c140eaacc2cc1d7dff26f70eee934b280e30b1/ops/review-patches/leads-dotted.patch"
          git apply --whitespace=nowarn /tmp/fix.patch
          test "$(git hash-object CHANGELOG.md)" = "b983f4b4b0966c5299515dc3d417a535976a033a"
          test "$(git hash-object dashboard/routers/intake.py)" = "6447654ff5036247b2823b79eda6f511d8cd5b13"
          test "$(git hash-object tests/test_intake_shannon.py)" = "39abf4428ca79237284fbf9807dd0ea67e46848c"
          test "$(git hash-object tests/_inmem_mongo.py)" = "dca68b2bea77e52770edcac614ac5126f47d2478"
          git add CHANGELOG.md dashboard/routers/intake.py tests/test_intake_shannon.py tests/_inmem_mongo.py
          git rm -f .github/workflows/apply-intake-dotted.yml
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "Keep blank indemnitor and defendant fields on later intake submits."
          git push origin HEAD:cursor/intake-upsert-preserve-24c1
