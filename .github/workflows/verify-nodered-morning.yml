# One-shot verify Node-RED morning prospecting after sync (ops only).
name: Verify Node-RED Morning Prospecting

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 178.156.179.237
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 8m
          timeout: 60s
          script: |
            set -euo pipefail
            echo "=== VERIFY $(date -u) ==="
            docker ps --filter name=shamrock-node-red --format '{{.Names}} {{.Status}}'
            echo "-- last 100 log lines --"
            docker logs shamrock-node-red --tail 100 2>&1
            echo "-- Admin API flows dump --"
            curl -sf --max-time 30 http://127.0.0.1:1880/flows -o /tmp/nr_flows.json
            python3 - <<'PY'
            import json
            f=json.load(open('/tmp/nr_flows.json'))
            morning=any(n.get('id')=='tab_morning_prospect' for n in f)
            subdefs=[n.get('id') for n in f if n.get('type')=='subflow']
            inj=[n for n in f if n.get('id')=='mp_inject_manual']
            cron=[n for n in f if n.get('id')=='mp_inject_0730']
            print('nodes',len(f),'morning',morning)
            print('has_safe_cron_def', 'subflow-safe-cron' in subdefs)
            print('has_slack_def', 'subflow-slack-notify' in subdefs)
            print('has_leads_api_def', 'subflow-leads-api' in subdefs)
            print('inject_id_present', bool(inj))
            print('cron', {k:cron[0].get(k) for k in ('crontab','name','type')} if cron else None)
            PY
            echo "-- volume packages --"
            VOL=$(docker volume inspect shamrock-leads_node-red-data --format '{{.Mountpoint}}')
            python3 -c "import json; p=json.load(open('$VOL/package.json')); print(sorted((p.get('dependencies') or {}).keys()))" 2>/dev/null || echo no_package_json
            ls "$VOL/node_modules" 2>/dev/null | rg -n 'node-red-dashboard|@flowfuse|mongodb4|node-red-contrib' || ls "$VOL/node_modules" 2>/dev/null | head -30 || echo no_modules
            echo "-- inject attempts --"
            for path in /inject/mp_inject_manual; do
              code=$(curl -s -o /tmp/i.txt -w '%{http_code}' -X POST "http://127.0.0.1:1880$path" -H 'Content-Type: application/json' -d '{}' || true)
              echo "$path -> $code $(head -c 120 /tmp/i.txt)"
            done
            echo "-- quiet env --"
            docker inspect shamrock-node-red --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(RESPECT_QUIET|QUIET_|SLACK_CHANNEL|TZ)=' || true
            grep -Eh '^(RESPECT_QUIET|QUIET_|SLACK_CHANNEL)' /opt/shamrock-node-red/.env /opt/shamrock-leads/.env 2>/dev/null || echo 'no quiet/slack-channel keys in env files'
            echo "=== DONE ==="
