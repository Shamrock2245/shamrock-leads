# ════════════════════════════════════════════════════════════════════════════════
# ShamrockLeads — Auto-Deploy to Hetzner VPS
# ════════════════════════════════════════════════════════════════════════════════
# Triggers on push to main. SSHes into the VPS, pulls latest code,
# rebuilds Docker images, and restarts all services.
#
# Required GitHub Secrets:
#   HETZNER_SSH_KEY              — Private SSH key for root@178.156.179.237
#   FIREBASE_ADMINSDK_B64        — Base64-encoded firebase-adminsdk.json
#   FIREBASE_GOOGLE_SERVICES_B64 — Base64-encoded google-services.json
#
# ════════════════════════════════════════════════════════════════════════════════

name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy ShamrockLeads
    runs-on: ubuntu-latest
    # Routine pushes retain recent Docker build cache so the core restart is bounded.
    # The osint-worker SpiderFoot image is not rebuilt unless its context changes.
    timeout-minutes: 45

    steps:
      # Fail fast with a clear message if the VPS is unreachable (e.g. Tailscale
      # exit-node misconfig blackholing public SSH — do not waste a full job).
      - name: Preflight SSH reachability
        run: |
          set -e
          echo "Probing 178.156.179.237:22 ..."
          for i in 1 2 3 4 5 6; do
            if timeout 8 bash -c 'echo >/dev/tcp/178.156.179.237/22' 2>/dev/null; then
              echo "✅ SSH port open (attempt $i)"
              exit 0
            fi
            echo "⏳ port closed/timeout (attempt $i/6) — retry in 10s"
            sleep 10
          done
          echo "::error::VPS SSH port 22 unreachable from GitHub runners. Check host networking / Tailscale (VPS must not use an exit node)."
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          FIREBASE_ADMINSDK_B64: ${{ secrets.FIREBASE_ADMINSDK_B64 }}
          FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}
        with:
          host: 178.156.179.237
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          # Long builds (pip + docker) need a live TCP channel; the cold build
          # observed on 2026-08-12 exceeded 30m before restart verification.
          command_timeout: 40m
          timeout: 60s
          envs: FIREBASE_ADMINSDK_B64,FIREBASE_GOOGLE_SERVICES_B64
          script: |
            set -e
            trap 'echo "❌ Deploy failed at line $LINENO (exit code $?)"; exit 1' ERR

            echo "═══════════════════════════════════════════════════"
            echo "  ShamrockLeads Deploy — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "═══════════════════════════════════════════════════"

            # Re-assert network safety every deploy (idempotent). Never let the VPS
            # route through a Tailscale exit node or peer MagicDNS — that blackholes
            # public SSH and breaks GitHub Actions deploys.
            if command -v tailscale >/dev/null 2>&1; then
              tailscale set --exit-node= --accept-dns=false --accept-routes=false 2>/dev/null || true
              systemctl start shamrock-net-harden.service 2>/dev/null || true
            fi

            cd /opt/shamrock-leads

            # ── Write Firebase secret files to config/ ────────────
            echo "🔑 Writing Firebase config files..."
            mkdir -p /opt/shamrock-leads/config
            if [ -n "$FIREBASE_ADMINSDK_B64" ]; then
              (echo "$FIREBASE_ADMINSDK_B64" | base64 -d 2>/dev/null || echo "$FIREBASE_ADMINSDK_B64" | base64 --decode 2>/dev/null || true) > /opt/shamrock-leads/config/firebase-adminsdk.json || true
              echo "   ✅ firebase-adminsdk.json written"
            else
              echo "   ⚠️  FIREBASE_ADMINSDK_B64 secret not set — skipping"
            fi
            if [ -n "$FIREBASE_GOOGLE_SERVICES_B64" ]; then
              (echo "$FIREBASE_GOOGLE_SERVICES_B64" | base64 -d 2>/dev/null || echo "$FIREBASE_GOOGLE_SERVICES_B64" | base64 --decode 2>/dev/null || true) > /opt/shamrock-leads/config/google-services.json || true
              echo "   ✅ google-services.json written"
            else
              echo "   ⚠️  FIREBASE_GOOGLE_SERVICES_B64 secret not set — skipping"
            fi

            # ── Pull latest code ──────────────────────────────────
            echo ""
            echo "📥 Pulling latest from GitHub..."
            git pull origin main || git fetch origin main || git fetch --all || true
            git reset --hard origin/main || git reset --hard HEAD || true

            echo ""
            echo "📋 Latest commit:"
            git log --oneline -1

            # ── Free disk before rebuild (failed builds leave layers; VPS is tight) ──
            echo ""
            echo "🧹 Cleaning up disk space..."
            df -h / || true
            docker system df 2>/dev/null || true

            # Stopped containers + anonymous volumes
            docker container prune -f 2>/dev/null || true
            docker volume prune -f 2>/dev/null || true

            # Retain recent build cache and tagged images on routine deploys. Clearing
            # all layers forced a cold 30+ minute core rebuild and exhausted the SSH
            # budget; age out only stale cache and dangling images here.
            docker builder prune -f --filter "until=168h" 2>/dev/null || true
            docker buildx prune -f --filter "until=168h" 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            # Host clutter
            apt-get clean 2>/dev/null || true
            journalctl --vacuum-size=80M 2>/dev/null || true
            rm -rf /tmp/pip-* /tmp/tmp* /var/tmp/pip-* 2>/dev/null || true
            rm -rf /var/lib/docker/tmp/* 2>/dev/null || true

            FREE_KB=$(df -Pk / | awk 'NR==2 {print $4}' | tr -dc '0-9')
            FREE_KB=${FREE_KB:-0}
            echo "   Disk free: $(df -h / | awk 'NR==2 {print $4}') (${FREE_KB} KB)"

            # If still under ~5 GB free, drop unused system objects hard
            if [ "$FREE_KB" -lt 5000000 2>/dev/null ]; then
              echo "   ⚠️ Low disk (<5GB) — docker system prune -af"
              docker system prune -af 2>/dev/null || true
              docker builder prune -af 2>/dev/null || true
              FREE_KB=$(df -Pk / | awk 'NR==2 {print $4}' | tr -dc '0-9')
              FREE_KB=${FREE_KB:-0}
              echo "   Disk free after system prune: $(df -h / | awk 'NR==2 {print $4}')"
            fi

            # Last resort: stop stack, remove project images, rebuild cold
            if [ "$FREE_KB" -lt 2500000 2>/dev/null ]; then
              echo "   ⚠️ Critical disk (<2.5GB) — stopping stack to reclaim image layers"
              docker compose down --remove-orphans 2>/dev/null || true
              docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
                | grep -E 'shamrock|leads|dashboard' \
                | awk '{print $2}' \
                | xargs -r docker rmi -f 2>/dev/null || true
              docker system prune -af 2>/dev/null || true
              echo "   Disk free after emergency reclaim: $(df -h / | awk 'NR==2 {print $4}')"
            fi

            # ── Ensure Obscura image is present (pulled only when missing) ──
            echo ""
            echo "🦀 Ensuring Obscura image..."
            if docker image inspect h4ckf0r0day/obscura:latest >/dev/null 2>&1; then
              echo "   ⏭️  Obscura image cached — leave in place"
            else
              docker pull h4ckf0r0day/obscura:latest || echo "   ⚠️ Obscura pull failed (will retry from cache)"
            fi

            # ── Rebuild core Docker images (skip osint-worker / alpr on every push) ──
            # osint-worker installs spiderfoot from source and regularly exceeds the
            # SSH command timeout. Rebuild it only when its Dockerfile/context changes.
            echo ""
            echo "🐳 Rebuilding Docker images (core: shamrock-leads + dashboard)..."
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            REBUILD_OSINT=0
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(Dockerfile\.osint|osint/|docker-compose\.yml)'; then
              REBUILD_OSINT=1
              echo "   📡 osint-worker context changed — will rebuild"
            else
              echo "   ⏭️  osint-worker unchanged — leaving running image"
            fi
            docker compose build shamrock-leads dashboard
            if [ "$REBUILD_OSINT" = "1" ]; then
              docker compose build osint-worker || echo "   ⚠️ osint-worker build failed (non-fatal)"
            fi

            # ── Clear compose name conflicts (hash-prefix orphans block recreate) ──
            # Failed/partial deploys leave containers like "abc123_shamrock-leads" while
            # the canonical name is still held — compose then fails with:
            #   Conflict. The container name "/shamrock-leads" is already in use
            # Do NOT docker compose down the whole project — that would stop
            # long-lived profile services (Postiz, DocuSeal, Temporal, frps).
            echo ""
            echo "🧹 Clearing container name conflicts (core stack only)..."
            for name in shamrock-leads shamrock-dashboard shamrock-obscura shamrock-traccar; do
              docker rm -f "$name" 2>/dev/null || true
            done
            if [ "$REBUILD_OSINT" = "1" ]; then
              docker rm -f shamrock-osint-worker 2>/dev/null || true
            fi
            # Hash-prefixed orphans from failed renames (e.g. c10e04090edd_shamrock-leads)
            docker ps -a --format '{{.Names}}' 2>/dev/null \
              | grep -E '^[a-f0-9]+_shamrock-(leads|dashboard|osint|obscura|traccar)' \
              | while read -r n; do
                  echo "   removing orphan $n"
                  docker rm -f "$n" 2>/dev/null || true
                done

            # ── Rolling restart ────────────────────────────────────
            echo ""
            echo "🔄 Starting stack..."
            # Prefer force-recreate of services we just built; fall back once if name conflict returns
            UP_SERVICES="shamrock-leads dashboard obscura traccar"
            if [ "$REBUILD_OSINT" = "1" ]; then
              UP_SERVICES="$UP_SERVICES osint-worker"
            fi
            if ! docker compose up -d --remove-orphans --force-recreate $UP_SERVICES; then
              echo "   ⚠️ compose up failed — second pass after hard name clear"
              for name in shamrock-leads shamrock-dashboard shamrock-obscura shamrock-traccar; do
                docker rm -f "$name" 2>/dev/null || true
              done
              docker ps -a --format '{{.Names}}' 2>/dev/null \
                | grep -E '^[a-f0-9]+_shamrock-(leads|dashboard|osint|obscura|traccar)' \
                | while read -r n; do docker rm -f "$n" 2>/dev/null || true; done
              docker compose up -d --remove-orphans --force-recreate $UP_SERVICES
            fi
            # Keep osint-worker up if we skipped rebuild
            docker compose up -d osint-worker 2>/dev/null || true

            # DocuSeal (paperwork profile) — ensure signing is up for portal tests
            echo ""
            echo "✍️  Ensuring DocuSeal (paperwork profile)..."
            docker compose --profile paperwork up -d docuseal-postgres docuseal 2>/dev/null || true

            # OpenCut (edit profile) — VPS Docker, not laptop Tailscale
            echo ""
            echo "🎬 Ensuring OpenCut (edit profile)..."
            REBUILD_OPENCUT=0
            if ! docker image inspect shamrock-leads-opencut >/dev/null 2>&1 \
              && ! docker image inspect shamrock-opencut >/dev/null 2>&1; then
              REBUILD_OPENCUT=1
              echo "   📦 no opencut image — will build"
            elif git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(opencut/|docker-compose.yml)'; then
              REBUILD_OPENCUT=1
              echo "   📦 opencut context changed — will rebuild"
            else
              echo "   ⏭️  opencut unchanged — start existing image"
            fi
            if [ "$REBUILD_OPENCUT" = "1" ]; then
              docker compose --profile edit build opencut || echo "   ⚠️ OpenCut build failed (non-fatal)"
            fi
            docker compose --profile edit up -d opencut-postgres opencut-redis opencut-redis-http opencut 2>/dev/null || true

            # Postiz: do NOT pull :latest or force-recreate on every CRM deploy.
            # Each recreate runs `prisma db push` + Mastra ALTER TABLE and leaves
            # dropped-column slots until mastra_ai_spans hits PG's 1600-col limit
            # (gitroomhq/postiz-app#1473) and /auth 500s.
            if docker ps -a --format '{{.Names}}' | grep -qx shamrock-postiz; then
              echo ""
              # Recreate Postiz only when its own service/env or social/ app
              # code changed. A compose-wide mem_limit tweak must NOT
              # force-recreate Postiz (prisma/Mastra 1600-col crash).
              if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(social/|scripts/repair_postiz_mastra\.sh)'; then
                echo "📱 Social app changed — start Postiz (no image pull)"
                docker compose --profile social up -d --no-deps postiz 2>/dev/null || true
                bash scripts/repair_postiz_mastra.sh || true
              else
                echo "⏭️  Postiz unchanged — leave running"
                if ! docker exec shamrock-postiz sh -c "ss -lntp 2>/dev/null | grep -q ':3000'"; then
                  echo "⚠️  Postiz backend down — repairing Mastra tables"
                  bash scripts/repair_postiz_mastra.sh || true
                fi
              fi
            fi

            # ── frp server (BlueBubbles tunnel) ──
            if [ -f deployment/frp/.frp_token ] && [ -f deployment/frp/frps.toml ]; then
              echo ""
              echo "🔐 Rehydrating frps.toml secrets from VPS token files..."
              TOKEN=$(cat deployment/frp/.frp_token)
              git show HEAD:deployment/frp/frps.toml > deployment/frp/frps.toml
              sed -i "s/CHANGE_ME_SET_FRP_TOKEN_IN_ENV/${TOKEN}/g" deployment/frp/frps.toml
              if [ -f deployment/frp/.frp_dashboard_pass ]; then
                DASH=$(cat deployment/frp/.frp_dashboard_pass)
                sed -i "s/CHANGE_ME_FRP_DASHBOARD_PASSWORD/${DASH}/g" deployment/frp/frps.toml
              fi
              chmod 600 deployment/frp/frps.toml
              docker compose --profile tunnel pull frps 2>/dev/null || true
              docker compose --profile tunnel up -d frps 2>/dev/null || true
            fi

            # ── Re-apply iptables rule for SOCKS proxy ──
            echo ""
            echo "🔌 Re-applying SOCKS proxy firewall rule..."
            iptables -C INPUT -p tcp --dport 1080 -s 172.18.0.0/16 -j ACCEPT 2>/dev/null || \
              iptables -I INPUT -p tcp --dport 1080 -s 172.18.0.0/16 -j ACCEPT 2>/dev/null || true
            echo "   ✅ Firewall rule check done"

            # ── Verify ────────────────────────────────────────────
            echo ""
            echo "⏳ Waiting for containers to stabilize..."
            sleep 15

            echo ""
            echo "📊 Container Status:"
            docker compose ps

            echo ""
            echo "🏥 Health Check:"
            HEALTH_URL="http://localhost:8088/health/live"
            SUCCESS=false
            for i in {1..18}; do
              if curl -sf --max-time 5 "$HEALTH_URL" > /dev/null 2>&1 || curl -sf --max-time 5 "http://127.0.0.1:5050/health/live" > /dev/null 2>&1; then
                SUCCESS=true
                break
              fi
              echo "   ⏳ Waiting for dashboard to respond (attempt $i/18)..."
              sleep 5
            done

            if [ "$SUCCESS" = true ]; then
              echo " ✅ Dashboard healthy (port 8088)"
            else
              echo " ⚠️ Dashboard health check failed after ~90s"
              docker logs shamrock-dashboard --tail 80 2>&1 || true
              exit 1
            fi

            echo ""
            echo "📜 Last 10 log lines (dashboard):"
            docker logs shamrock-dashboard --tail 10 2>&1

            echo ""
            echo "🔥 Firebase config check:"
            ls -la /opt/shamrock-leads/config/ 2>/dev/null || echo "   config/ directory not found"

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  ✅ Deploy complete!"
            echo "═══════════════════════════════════════════════════"
