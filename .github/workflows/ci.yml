# ===============================================================================
# ShamrockLeads — PR / main CI (no deploy, no live clients, no secrets)
# ===============================================================================
# Deploy remains .github/workflows/deploy-hetzner.yml on push to main.
# This workflow is the missing production gate: syntax + contract tests
# must pass before a human merges to main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Syntax + contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -r requirements-dashboard.txt

      - name: Byte-compile application packages
        run: |
          python -m compileall -q \
            api core scoring services models scrapers dashboard config \
            writers scripts cron.py main.py

      - name: Focused fail-closed / contract tests
        env:
          ENV: test
          SECRET_KEY: ci-not-a-real-secret
        run: |
          pytest -q \
            tests/test_secret_scanner.py \
            tests/test_source_contract_run_guard.py \
            tests/test_source_booking_identity_guard.py \
            tests/test_registered_counties_coverage.py \
            tests/test_recon_documentation_contract.py \
            tests/test_recon_evidence_contract.py \
            tests/test_subdomains.py \
            tests/test_unhandled_exception_privacy.py \
            tests/test_dashboard_source_states.py \
            tests/test_scraper_resilience.py \
            tests/test_base_scraper_self_heal.py \
            tests/test_source_state_drift.py \
            tests/test_lee_rate_limit.py \
            tests/test_swipesimple_invoice_service.py \
            tests/test_confirmed_booking_intake.py \
            tests/test_deferred_client_intake.py \
            tests/test_intake_defendant_extract.py \
            tests/test_intake_shannon.py \
            tests/test_docuseal_completed_share_invoice.py \
            tests/test_docuseal_completion_handler.py \
            tests/test_docuseal_template_drift.py \
            tests/test_packet_pay_and_court_seed.py \
            tests/test_packet_payment_link_send_once.py \
            tests/test_legacy_payment_link_call_sites.py \
            tests/test_swipesimple_dispatch.py \
            tests/test_tncis_fail_closed.py \
            --tb=short
