# ===============================================================================
# ShamrockLeads — PR / main CI (no deploy, no live clients, no secrets)
# ===============================================================================
# Deploy remains .github/workflows/deploy-hetzner.yml on push to main.
# This workflow is the missing production gate: syntax + contract tests
# must pass before a human merges to main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Syntax + contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -r requirements-dashboard.txt

      - name: Byte-compile application packages
        run: |
          python -m compileall -q \
            api core scoring services models scrapers dashboard config \
            writers scripts cron.py main.py

      - name: Focused fail-closed / contract tests
        env:
          ENV: test
          SECRET_KEY: ci-not-a-real-secret
        # Palmetto agent-line placement is test_palmetto_packet_fields,
        # test_agent_name_fallback, and test_palmetto_docuseal_apply.
        # Application DEFENDANT, POWER NO., and CASE NO. placement is
        # test_palmetto_application_header_placement.
        run: |
          pytest -q \
            tests/test_tenant_scope.py \
            tests/test_agency_onboarding.py \
            tests/test_agency_billing.py \
            tests/test_surety_entitlements.py \
            tests/test_lead_subscriptions.py \
            tests/test_start_bond_packet.py \
            tests/test_secret_scanner.py \
            tests/test_brand_contacts.py \
