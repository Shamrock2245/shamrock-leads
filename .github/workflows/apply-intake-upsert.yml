name: apply-intake-upsert
on:
  push:
    branches: [cursor/intake-upsert-preserve-24c1]
    paths: ['.github/workflows/apply-intake-upsert.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/intake-upsert-preserve-24c1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      - name: Apply verified patch and remove this helper
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/fix.patch "https://raw.githubusercontent.com/Shamrock2245/shamrock-telegram-app/b98f554b02986264116a5912fe8290fb8f652a74/ops/review-patches/leads.patch"
          git apply --whitespace=nowarn /tmp/fix.patch
          test "$(git hash-object CHANGELOG.md)" = "9de790e739bfdda5e093ba5c95c1e1ea34f3414b"
          test "$(git hash-object dashboard/routers/intake.py)" = "e6fc299955a8eb64a3857031071c38ed1f314053"
          test "$(git hash-object tests/test_intake_shannon.py)" = "5282a5acafb460aa7bf55d23b60379f161176235"
          git add CHANGELOG.md dashboard/routers/intake.py tests/test_intake_shannon.py
          git rm -f .github/workflows/apply-intake-upsert.yml
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "Keep intake lifecycle fields on insert so a repeat submit cannot regress them."
          git push origin HEAD:cursor/intake-upsert-preserve-24c1
