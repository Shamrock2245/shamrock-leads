# Read-only Node-RED log/health check on the VPS (ops only).
# - workflow_dispatch + daily schedule; no POST, no curl to Node-RED, no restart, no writes.
# - Daily run (13:17 UTC = 9:17 AM EDT / 8:17 AM EST, always after the 7:30 AM ET
#   prospecting run) uploads a filtered start/error/warn snapshot artifact (14 days).
# - Same SSH host/secret as sync-nodered.yml. Output is redacted on the VPS
#   before it is printed (fails closed if perl is unavailable).
name: Node-RED Log Check (read-only)

on:
  workflow_dispatch:
    inputs:
      tail:
        description: "Number of container log lines to show (default 300, max 2000)"
        type: string
        default: "300"
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  logcheck:
    name: Read-only NR log check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate tail input
        id: tail
        env:
          TAIL_IN: ${{ inputs.tail }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::178.156.179.237"
          if [ "$EVENT" = "schedule" ]; then TAIL_IN=2000; fi
          n="${TAIL_IN:-300}"
          case "$n" in ''|*[!0-9]*) n=300 ;; esac
          n=$((10#$n))
          if [ "$n" -lt 1 ]; then n=300; fi
          if [ "$n" -gt 2000 ]; then n=2000; fi
          echo "tail=$n" >> "$GITHUB_OUTPUT"
          echo "Using tail=$n"

      - name: Read-only checks via SSH
        uses: appleboy/ssh-action@v1
        env:
          NR_TAIL: ${{ steps.tail.outputs.tail }}
        with:
          host: 178.156.179.237
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 5m
          timeout: 60s
          envs: NR_TAIL
          script: |
            set -uo pipefail
            case "${NR_TAIL:-}" in ''|*[!0-9]*) NR_TAIL=300 ;; esac
            if [ "$NR_TAIL" -gt 2000 ]; then NR_TAIL=2000; fi

            if ! command -v perl >/dev/null 2>&1; then
              echo "perl not available on host; refusing to print unredacted output"; exit 1
            fi
            RED=$(mktemp)
            trap 'rm -f "$RED"' EXIT
            cat > "$RED" <<'PL'
            s#(mongodb(?:\+srv)?://)[^\s/@]+@#${1}<redacted>@#gi;
            s#(script\.google\.com/macros/s/)[A-Za-z0-9_-]+#${1}<redacted>#gi;
            s#https?://[^\s]*(?:key|token|secret|sig)[^\s]*#<redacted-url>#gi;
            s#xox[abprs]-[A-Za-z0-9-]+#xox-<redacted>#g;
            s#(authorization["']?\s*[:=]\s*["']?)(?:(?:bearer|basic|token)\s+)?[^\s"',}]+#${1}<redacted>#gi;
            s#(bearer\s+)[^\s"',}]+#${1}<redacted>#gi;
            s#([A-Za-z0-9_.-]*(?:key|token|secret|password|passwd|pwd)[A-Za-z0-9_]*["']?\s*[=:]\s*["']?)(?!<redacted)[^\s"'&,}]+#${1}<redacted>#gi;
            s#\b[A-Fa-f0-9]{32,}\b#<redacted-hex>#g;
            s#(?<![A-Za-z0-9+/_=-])(?=[A-Za-z0-9+/_=-]*[0-9])(?=[A-Za-z0-9+/_=-]*[a-z])(?=[A-Za-z0-9+/_=-]*[A-Z])[A-Za-z0-9+/_-]{32,}={0,2}#<redacted-b64>#g;
            PL
            redact() { perl -p "$RED"; }

            echo "=== Node-RED read-only log check $(date -u '+%Y-%m-%dT%H:%M:%SZ') tail=${NR_TAIL} ==="
            echo "-- container status --"
            docker ps --filter name=shamrock-node-red --format '{{.Names}}\t{{.Status}}\t{{.RunningFor}}' 2>&1 | redact
            echo "-- health / startedAt / restartCount --"
            docker inspect --format '{{.State.Health.Status}} {{.State.StartedAt}} {{.RestartCount}}' shamrock-node-red 2>&1 | redact
            echo "-- /opt/shamrock-node-red HEAD --"
            git -C /opt/shamrock-node-red rev-parse --short HEAD 2>&1 | redact
            echo "-- legacy scraper path inside container (read-only test -e) --"
            docker exec shamrock-node-red test -e /Users/brendan/Desktop/shamrock-active-software/swfl-arrest-scrapers \
              && echo "legacy scraper path: present" || echo "legacy scraper path: absent"
            echo "-- docker logs --tail ${NR_TAIL} --timestamps (redacted) --"
            docker logs --tail "$NR_TAIL" --timestamps shamrock-node-red 2>&1 | redact
            echo "=== DONE ==="

      - name: Filtered snapshot via SSH (read-only)
        id: snap
        uses: appleboy/ssh-action@v1
        env:
          NR_TAIL: ${{ steps.tail.outputs.tail }}
        with:
          host: 178.156.179.237
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 5m
          timeout: 60s
          envs: NR_TAIL
          capture_stdout: true
          script: |
            set -uo pipefail
            case "${NR_TAIL:-}" in ''|*[!0-9]*) NR_TAIL=300 ;; esac
            if [ "$NR_TAIL" -gt 2000 ]; then NR_TAIL=2000; fi

            if ! command -v perl >/dev/null 2>&1; then
              echo "perl not available on host; refusing to print unredacted output"; exit 1
            fi
            RED=$(mktemp)
            trap 'rm -f "$RED"' EXIT
            cat > "$RED" <<'PL'
            s#(mongodb(?:\+srv)?://)[^\s/@]+@#${1}<redacted>@#gi;
            s#(script\.google\.com/macros/s/)[A-Za-z0-9_-]+#${1}<redacted>#gi;
            s#https?://[^\s]*(?:key|token|secret|sig)[^\s]*#<redacted-url>#gi;
            s#xox[abprs]-[A-Za-z0-9-]+#xox-<redacted>#g;
            s#(authorization["']?\s*[:=]\s*["']?)(?:(?:bearer|basic|token)\s+)?[^\s"',}]+#${1}<redacted>#gi;
            s#(bearer\s+)[^\s"',}]+#${1}<redacted>#gi;
            s#([A-Za-z0-9_.-]*(?:key|token|secret|password|passwd|pwd)[A-Za-z0-9_]*["']?\s*[=:]\s*["']?)(?!<redacted)[^\s"'&,}]+#${1}<redacted>#gi;
            s#\b[A-Fa-f0-9]{32,}\b#<redacted-hex>#g;
            s#(?<![A-Za-z0-9+/_=-])(?=[A-Za-z0-9+/_=-]*[0-9])(?=[A-Za-z0-9+/_=-]*[a-z])(?=[A-Za-z0-9+/_=-]*[A-Z])[A-Za-z0-9+/_-]{32,}={0,2}#<redacted-b64>#g;
            PL
            redact() { perl -p "$RED"; }

            echo "=== SNAPSHOT BEGIN ==="
            echo "snapshot_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ') tail=${NR_TAIL} filter=start|error|warn|fail|exception|compile"
            echo "status: $(docker ps --filter name=shamrock-node-red --format '{{.Names}} {{.Status}}' 2>&1 | redact)"
            echo "health_started_restarts: $(docker inspect --format '{{.State.Health.Status}} {{.State.StartedAt}} {{.RestartCount}}' shamrock-node-red 2>&1 | redact)"
            echo "nr_head: $(git -C /opt/shamrock-node-red rev-parse --short HEAD 2>&1 | redact)"
            echo "first_log_line: $(docker logs --tail "$NR_TAIL" --timestamps shamrock-node-red 2>&1 | head -n 1 | cut -c1-40 | redact)"
            echo "--- filtered log lines (redacted; max 300 lines x 300 chars) ---"
            docker logs --tail "$NR_TAIL" --timestamps shamrock-node-red 2>&1 | redact \
              | grep -Ei 'start|error|warn|fail|exception|compile' | cut -c1-300 | tail -n 300
            echo "=== SNAPSHOT END ==="

      - name: Build snapshot file
        env:
          SNAP: ${{ steps.snap.outputs.stdout }}
        run: |
          set -euo pipefail
          mkdir -p snapshot
          printf '%s\n' "$SNAP" | sed -n '/^=== SNAPSHOT BEGIN ===$/,/^=== SNAPSHOT END ===$/p' > snapshot/nodered-log-snapshot.txt
          # Guard: refuse to upload if anything secret-shaped slipped through redaction
          if grep -Eq 'xox[abprs]-[A-Za-z0-9]|mongodb(\+srv)?://[^<[:space:]]+:[^@[:space:]]+@|macros/s/AKfy|[Bb]earer [A-Za-z0-9._-]{16,}' snapshot/nodered-log-snapshot.txt; then
            echo "::error::secret-shaped string found in snapshot; not uploading"; exit 1
          fi
          echo "snapshot lines: $(wc -l < snapshot/nodered-log-snapshot.txt), bytes: $(wc -c < snapshot/nodered-log-snapshot.txt)"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodered-log-snapshot-${{ github.run_id }}
          path: snapshot/nodered-log-snapshot.txt
          retention-days: 14
          if-no-files-found: error
