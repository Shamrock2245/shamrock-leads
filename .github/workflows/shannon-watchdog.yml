name: Shannon path watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Voice / GAS / BB / Mem0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public health endpoints
        run: |
          python3 - << 'EOF'
          import json, urllib.request, time, sys

          def probe(name, url, method="GET", validate_fn=None, timeout=25):
              headers = {
                  "User-Agent": "ShamrockWatchdog/1.0 (GitHubActions; HealthCheck)",
                  "Accept": "application/json, */*"
              }
              max_retries = 3
              last_err = None
              for attempt in range(1, max_retries + 1):
                  try:
                      req = urllib.request.Request(url, method=method, headers=headers)
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          status = resp.status
                          body = resp.read().decode("utf-8")
                          if validate_fn:
                              validate_fn(status, body)
                          print(f"✅ [{name}] OK (attempt {attempt}, HTTP {status})")
                          return True
                  except urllib.error.HTTPError as he:
                      body = he.read().decode("utf-8")
                      if validate_fn:
                          try:
                              validate_fn(he.code, body)
                              print(f"✅ [{name}] Expected HTTP {he.code} (attempt {attempt})")
                              return True
                          except Exception as ve:
                              last_err = f"HTTP {he.code} validation error: {ve}"
                      else:
                          last_err = f"HTTP {he.code}: {body[:200]}"
                  except Exception as e:
                      last_err = f"{type(e).__name__}: {e}"
                  
                  print(f"⚠️ [{name}] attempt {attempt}/{max_retries} failed: {last_err}. Retrying...")
                  time.sleep(3)

              print(f"❌ [{name}] FAILED after {max_retries} attempts: {last_err}")
              return False

          print("🔍 Running Shannon Path Watchdog probes...")
          results = []

          # 1. CRM Health
          results.append(probe(
              "CRM Health",
              "https://leads.shamrockbailbonds.biz/health",
              validate_fn=lambda s, b: json.loads(b).get("status") == "ok"
          ))

          # 2. BlueBubbles Status
          results.append(probe(
              "BlueBubbles Status",
              "https://leads.shamrockbailbonds.biz/api/imessage/status",
              validate_fn=lambda s, b: "connected" in json.loads(b)
          ))

          # 3. Shannon Aggregate Health
          results.append(probe(
              "Shannon Aggregate Health",
              "https://leads.shamrockbailbonds.biz/api/ops/shannon-health",
              validate_fn=lambda s, b: "checks" in json.loads(b)
          ))

          # 4. Twilio Voice (Unsigned must 403)
          results.append(probe(
              "Twilio Voice Guard",
              "https://shamrock-telegram.netlify.app/api/twilio-voice",
              method="POST",
              validate_fn=lambda s, b: s == 403
          ))

          # 5. Mem0 Memory Status
          def check_mem0(s, b):
              d = json.loads(b)
              assert d.get("success") is True, f"success not true: {d}"
              assert "key_prefix" not in json.dumps(d), "key_prefix leaked"
              assert (d.get("mem0") or {}).get("configured") is True, f"mem0 not configured: {d}"

          results.append(probe(
              "Mem0 Memory Status",
              "https://leads.shamrockbailbonds.biz/api/agent-brain/memory/status",
              validate_fn=check_mem0
          ))

          if all(results):
              print("\n🎉 ALL 5 SHANNON PATH WATCHDOG CHECKS PASSED!")
              sys.exit(0)
          else:
              print(f"\n❌ {results.count(False)} check(s) failed!")
              sys.exit(1)
          EOF

