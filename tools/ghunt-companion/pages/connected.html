<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GHunt Companion</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0b1220; color: #e2e8f0; }
    .wrap { max-width: 560px; margin: 40px auto; padding: 24px; background: #111827; border-radius: 14px; border: 1px solid #334155; }
    img.logo { height: 56px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #94a3b8; line-height: 1.5; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #10b981; color: #052e16; font-weight: 700; cursor: pointer; }
    button.secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 12px 0; }
    .status { margin-top: 16px; font-size: 13px; color: #fbbf24; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../assets/ghunt_full_light.png" alt="GHunt">
    <h1>Connected to Google</h1>
    <p>Use Method 2. Paste the blob into ShamrockLeads → OSINT → Engines → Save GHunt session. Method 1 (localhost:60067) does not work with Docker.</p>
    <div class="row">
      <span>Method 2 — copy encoded credentials</span>
      <button id="method_base64" type="button">Copy blob</button>
    </div>
    <div class="row">
      <span>Method 1 — feed GHunt listener (laptop only)</span>
      <button id="method_server" class="secondary" type="button">Launch</button>
    </div>
    <p class="status" id="status_text">Waiting for interaction</p>
  </div>
  <script type="module" src="connected.js"></script>
</body>
</html>
