<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; background: #0f172a; color: #e2e8f0; }
    img { height: 52px; display: block; margin: 0 auto 12px; }
    button { width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: #10b981; color: #052e16; font-weight: 700; cursor: pointer; }
    p { font-size: 11px; color: #94a3b8; line-height: 1.4; margin: 10px 0 0; }
  </style>
</head>
<body>
  <img src="../assets/ghunt_full_light.png" alt="GHunt">
  <button id="start_sync" type="button">1. Synchronize to GHunt (Google Sign-in)</button>
  <button id="copy_now" type="button" style="margin-top:8px;background:rgba(52,211,153,0.15);border:1px solid #10b981;color:#34d399">2. Copy Method 2 Blob Now</button>
  <div id="popup_status" style="font-size:11px;margin-top:8px;line-height:1.4"></div>
  <p style="font-size:10px;color:#94a3b8;margin-top:8px;line-height:1.4">Tip: If Google hangs on "One moment please...", use a clean Chrome profile with <strong>only 1 Google account</strong> signed in (multi-account profiles can block android auth).</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
