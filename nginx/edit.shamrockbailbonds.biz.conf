# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name edit.shamrockbailbonds.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — OpenCut video editor
# Upstream: docker compose --profile edit → host :5320 → container :3000
# Origin is THIS VPS. Do not proxy to the laptop / Tailscale.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edit.shamrockbailbonds.biz;

    ssl_certificate     /etc/letsencrypt/live/edit.shamrockbailbonds.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edit.shamrockbailbonds.biz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy   "frame-ancestors 'self' https://leads.shamrockbailbonds.biz https://social.shamrockbailbonds.biz;" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 512m;
    server_tokens off;

    location / {
        proxy_hide_header X-Frame-Options;

        proxy_pass         http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
