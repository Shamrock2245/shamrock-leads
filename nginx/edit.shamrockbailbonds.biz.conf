# ════════════════════════════════════════════════════════════════════════════════
# Nginx Reverse Proxy — edit.shamrockbailbonds.biz
# OpenCut video editor — Docker on the VPS (NOT the laptop, NOT Postiz)
# ════════════════════════════════════════════════════════════════════════════════
#
# PURPOSE
#   Public HTTPS edge for OpenCut running in Docker:
#     docker compose --profile edit up -d
#   Host :5320 → container :3000 (shamrock-opencut)
#
# INSTALL (two-stage — HTTP first, then certbot adds HTTPS)
#   1. sudo cp nginx/edit.shamrockbailbonds.biz.conf /etc/nginx/sites-available/
#   2. sudo ln -sf .../sites-available/edit.shamrockbailbonds.biz.conf .../sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d edit.shamrockbailbonds.biz \
#                   --non-interactive --agree-tos -m admin@shamrockbailbonds.biz
#
# DNS (Wix): A  edit  →  178.156.179.237
# ════════════════════════════════════════════════════════════════════════════════

upstream opencut_docker {
    server 127.0.0.1:5320;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name edit.shamrockbailbonds.biz;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 512m;

    location / {
        proxy_pass         http://opencut_docker;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
