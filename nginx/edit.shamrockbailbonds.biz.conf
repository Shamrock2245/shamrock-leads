# ════════════════════════════════════════════════════════════════════════════════
# Nginx Reverse Proxy — edit.shamrockbailbonds.biz
# OpenCut video editor (public edge on VPS, origin ALWAYS the laptop)
# ════════════════════════════════════════════════════════════════════════════════
#
# PURPOSE
#   Public HTTPS edge for OpenCut. Origin is brendans-macbook-pro-4 via Tailscale.
#   NEVER point at shamrocksimac / iMac. Laptop is the always-on origin.
#   NOT under Postiz/social. No SSH -R, no Warren, no frp.
#
#   Laptop process manager: PM2 apps opencut-web + opencut-controller
#     (opencut-controller/ecosystem.config.cjs)
#
# INSTALL (two-stage — HTTP first, then certbot adds HTTPS)
#   1. Copy config + enable site:
#      sudo cp nginx/edit.shamrockbailbonds.biz.conf /etc/nginx/sites-available/
#      sudo ln -sf /etc/nginx/sites-available/edit.shamrockbailbonds.biz.conf \
#                  /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#   2. Obtain SSL cert (certbot will add the HTTPS block automatically):
#      sudo certbot --nginx -d edit.shamrockbailbonds.biz \
#                   --non-interactive --agree-tos -m admin@shamrockbailbonds.biz
#
# DNS (Wix DNS panel)
#   Type: A    Host: edit    Value: 178.156.179.237    TTL: 300
#
# This config starts as HTTP-only. Certbot --nginx will add 443 + redirect.
# ════════════════════════════════════════════════════════════════════════════════

upstream opencut_ts {
    server 100.119.187.33:3000;   # brendans-macbook-pro-4 ONLY
    keepalive 8;
}

# HTTP (ACME + temporary until LE cert)
server {
    listen 80;
    listen [::]:80;
    server_name edit.shamrockbailbonds.biz;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 512m;

    location / {
        proxy_pass         http://opencut_ts;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /_next/webpack-hmr {
        proxy_pass http://opencut_ts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
