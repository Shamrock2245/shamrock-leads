# ════════════════════════════════════════════════════════════════════════════════
# Nginx Reverse Proxy — bb.shamrockbailbonds.biz (optional TLS front)
# ════════════════════════════════════════════════════════════════════════════════
#
# PURPOSE
#   Optional VPS TLS front for BlueBubbles when the Cloudflare named tunnel is
#   down. Primary path remains the Cloudflare tunnel CNAME.
#
#   Primary:  bb.shamrockbailbonds.biz → Cloudflare tunnel → iMac :1234
#   Fallback: this vhost → localhost:12434 (frp) → iMac :1234
#
# INSTALL (only if using VPS TLS instead of / in addition to the CF tunnel)
#   1. Point DNS A bb → 178.156.179.237 (do not do this if the CF CNAME is live)
#   2. sudo cp nginx/bb.shamrockbailbonds.biz.conf /etc/nginx/sites-available/
#   3. sudo ln -sf .../sites-available/bb.shamrockbailbonds.biz.conf .../sites-enabled/
#   4. sudo certbot --nginx -d bb.shamrockbailbonds.biz
#
# See docs/FRP_TUNNEL.md and docs/runbooks/bluebubbles-tunnel.md
# ════════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name bb.shamrockbailbonds.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:12434;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
